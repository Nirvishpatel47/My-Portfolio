<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404: Page Not Found &mdash; Nirvish Patel</title>
  <meta name="description" content="Page not found.">
  <meta name="robots" content="noindex, follow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/styles.css">

  <script>
    (function() {
      try {
        var saved = localStorage.getItem('nirvish_theme_preference');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (theme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.removeAttribute('data-theme');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="brand-title">
        <span class="brand-dot"></span>
        <span>Nirvish Patel</span>
      </a>

      <nav class="desktop-nav" aria-label="Main Navigation">
        <a href="/" class="nav-link">Home</a>
        <a href="/work/" class="nav-link">Work</a>
        <a href="/experience/" class="nav-link">Experience</a>
        <a href="/about/" class="nav-link">About</a>
        <a href="/contact/" class="nav-link">Contact</a>
      </nav>

      <div class="header-actions">
        <button class="theme-toggle-btn" type="button" aria-label="Toggle theme">
          <span class="theme-icon"></span>
          <span class="theme-text">Dark</span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="error-page-wrapper">
        <div class="error-code">404</div>
        <h1 class="error-title">Page not found</h1>
        <p class="error-desc">
          The page or document you were looking for does not exist or may have been moved.
        </p>
        <div class="hero-cta-group" style="justify-content: center;">
          <a href="/" class="btn btn-primary">Return to Homepage &rarr;</a>
          <a href="/work/" class="btn btn-secondary">Explore Work</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>&copy; 2026 Nirvish Patel &bull; Independent Developer</div>
      <nav class="footer-nav">
        <a href="/">Home</a>
        <a href="/work/">Work</a>
        <a href="/experience/">Experience</a>
        <a href="/about/">About</a>
        <a href="/contact/">Contact</a>
      </nav>
    </div>
  </footer>

  <script src="/script.js"></script>
</body>
</html>
